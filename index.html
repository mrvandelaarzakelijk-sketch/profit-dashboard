<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050709">
<title>Profit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#050709; --surface:#0c1017; --surface-2:#141a24; --line:#161c26;
    --txt:#e8edf4; --muted:#7d8aa0; --dim:#525d70;
    --green:#00ff88; --red:#ff5c5c; --accent:#00e5c7; --amber:#ff9500; --pink:#ff2d78;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--font);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .wrap{padding:14px 16px 90px;max-width:640px;margin:0 auto;}

  /* Header */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .top h1{font-size:22px;font-weight:700;letter-spacing:-.5px;}
  .top .date{font-size:12px;color:var(--dim);margin-top:2px;}
  .refresh{width:40px;height:40px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);
    font-size:16px;transition:.2s;}
  .refresh:active{transform:scale(.92);background:var(--surface-2);}

  /* Period tabs */
  .periods{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;
    scrollbar-width:none;padding-bottom:2px;}
  .periods::-webkit-scrollbar{display:none;}
  .pill{flex:0 0 auto;padding:8px 15px;border-radius:20px;background:var(--surface);
    border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;
    white-space:nowrap;transition:.15s;}
  .pill.active{background:var(--accent);color:#04121a;border-color:var(--accent);}
  .pill:active{transform:scale(.95);}

  /* Datumkiezer */
  .daterange{display:flex;align-items:flex-end;gap:10px;margin:-4px 0 16px;
    padding:12px 14px;background:#000;border:1px solid var(--line);border-radius:14px;}
  .daterange .df{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
  .daterange label{font-size:10px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.6px;font-weight:600;}
  .daterange input[type=date]{background:var(--surface-2);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:9px 10px;font-size:13px;font-family:var(--font);
    width:100%;color-scheme:dark;}
  .daterange .dsep{color:var(--dim);font-size:14px;padding-bottom:10px;}

  /* Store tabs */
  .stores{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;
    scrollbar-width:none;}
  .stores::-webkit-scrollbar{display:none;}
  .store{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 13px;
    border-radius:12px;background:var(--surface);border:1px solid var(--line);
    color:var(--muted);font-size:13px;font-weight:600;transition:.15s;}
  .store .dot{width:8px;height:8px;border-radius:50%;}
  .store.active{color:var(--txt);border-color:var(--dim);background:var(--surface-2);}
  .store:active{transform:scale(.96);}

  /* Hero profit */
  .hero{background:#000;border:none;border-radius:20px;padding:20px;margin-bottom:14px;
    position:relative;overflow:hidden;display:flex;align-items:center;
    justify-content:space-between;gap:10px;}
  .hero-left{position:relative;z-index:2;min-width:0;}
  .hero-marge{position:relative;flex:0 0 auto;width:150px;height:150px;
    display:grid;place-items:center;}
  .hero-marge #gl3d{position:absolute;inset:0;width:150px;height:150px;
    opacity:.75;pointer-events:none;
    -webkit-mask-image:radial-gradient(circle,#000 52%,transparent 74%);
    mask-image:radial-gradient(circle,#000 52%,transparent 74%);}
  .marge-num{position:relative;z-index:2;display:flex;flex-direction:column;
    align-items:center;line-height:1;pointer-events:none;}
  .marge-num b{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--green);
    text-shadow:0 2px 16px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.8);}
  .marge-num em{font-style:normal;font-size:10px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-top:3px;
    text-shadow:0 1px 6px rgba(0,0,0,.9);}
  .hero .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;
    letter-spacing:.8px;margin-bottom:6px;}
  .hero .val{font-size:34px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;}
  .hero .sub{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;}
  .chg{font-weight:700;padding:2px 8px;border-radius:8px;font-size:12px;}
  .chg.up{color:var(--green);background:rgba(47,214,125,.12);}
  .chg.down{color:var(--red);background:rgba(255,92,92,.12);}
  .hero .margin{color:var(--dim);}

  /* KPI grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .card{background:#000;border:1px solid var(--line);border-radius:16px;padding:13px 14px;}
  .card .lbl{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
  .card .val{font-size:24px;font-weight:700;letter-spacing:-.5px;}
  .card .val .u{font-size:14px;color:var(--muted);font-weight:600;}
  .card .foot{font-size:11px;margin-top:6px;font-weight:600;}
  .up-t{color:var(--green);} .down-t{color:var(--red);} .neu-t{color:var(--dim);} .amber-t{color:var(--amber);}
  .ico{width:6px;height:6px;border-radius:2px;}

  /* Breakdown */
  .section-lbl{font-size:12px;color:var(--dim);font-weight:700;text-transform:uppercase;
    letter-spacing:.8px;margin:20px 4px 10px;}
  .row{display:flex;align-items:center;justify-content:space-between;
    padding:13px 15px;background:#000;border:1px solid var(--line);
    border-radius:14px;margin-bottom:8px;}
  .row .name{font-size:14px;font-weight:600;color:var(--dim);}
  .row .amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}

  /* Bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,7,9,.92);
    backdrop-filter:blur(20px);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);
    font-size:10px;font-weight:600;}
  .nav a.on{color:var(--accent);}
  .nav .g{font-size:19px;}

  /* Inkoop / scraper */
  .scrape-box{background:#000;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;}
  .scrape-box .lbl{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:8px;}
  .scrape-form{display:flex;gap:8px;}
  .scrape-form input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:11px 12px;font-size:14px;font-family:var(--font);}
  .scrape-form input:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--accent);color:#04121a;border:none;border-radius:10px;padding:10px 16px;
    font-size:13px;font-weight:700;font-family:var(--font);white-space:nowrap;transition:.15s;}
  .scrape-form .btn{padding:0 16px;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.5;}
  .btn.ghost{background:var(--surface);color:var(--muted);border:1px solid var(--line);padding:8px 12px;font-size:12px;}
  .scrape-msg{font-size:12px;color:var(--amber);margin-top:8px;min-height:16px;font-weight:600;}
  .scrape-msg.ok{color:var(--green);}
  .scrape-sites{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .scrape-sites span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:3px 8px;}
  .prod{display:flex;gap:12px;align-items:flex-start;padding:12px;background:#000;
    border:1px solid var(--line);border-radius:14px;margin-bottom:8px;position:relative;}
  .prod-img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:0 0 auto;}
  .prod-body{flex:1;min-width:0;padding-right:26px;}
  .prod-meta{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;
    font-weight:600;margin-bottom:3px;}
  .prod-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:13px;font-weight:600;color:var(--txt);text-decoration:none;line-height:1.3;}
  .prod-price{font-size:13px;margin-top:6px;color:var(--muted);}
  .prod-price b{color:var(--green);font-size:16px;font-weight:800;margin-left:4px;}
  .prod-orig{font-size:12px;color:var(--dim);margin-left:6px;}
  .prod-calc{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .prod-calc label{font-size:11px;color:var(--dim);font-weight:600;}
  .prod-calc input{width:84px;background:var(--surface-2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:7px 8px;font-size:13px;font-family:var(--font);}
  .prod-calc input:focus{outline:none;border-color:var(--accent);}
  .prod-marge{font-size:12px;font-weight:700;}
  .prod .x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;
    background:var(--surface);border:1px solid var(--line);color:var(--dim);font-size:12px;
    display:grid;place-items:center;}
  .prod-actions{display:flex;gap:8px;margin-top:10px;}
  .list-head{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 10px;}
  .list-head .section-lbl{margin:0;}
  .empty{font-size:13px;color:var(--dim);padding:16px;text-align:center;line-height:1.5;
    border:1px dashed var(--line);border-radius:14px;}

  .fade{animation:f .3s ease;}
  @keyframes f{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* Inlogscherm */
  #lockscreen{position:fixed;inset:0;background:var(--bg);z-index:1000;
    display:grid;place-items:center;padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top));}
  .lock-card{width:100%;max-width:340px;text-align:center;}
  .lock-logo{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;
    background:#000;border:1px solid var(--line);display:grid;place-items:center;
    font-size:24px;color:var(--green);}
  .lock-card h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;}
  .lock-card p{font-size:13px;color:var(--dim);margin-bottom:24px;}
  .lock-card input{width:100%;background:#000;border:1px solid var(--line);
    color:var(--txt);border-radius:12px;padding:14px 16px;font-size:15px;
    font-family:var(--font);text-align:center;margin-bottom:10px;}
  .lock-card input:focus{outline:none;border-color:var(--green);}
  .lock-card button{width:100%;background:var(--green);color:#04121a;border:none;
    border-radius:12px;padding:14px;font-size:15px;font-weight:700;
    font-family:var(--font);transition:.15s;}
  .lock-card button:active{transform:scale(.97);}
  .lock-err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px;font-weight:600;}
</style>
</head>
<body>
<div id="lockscreen">
  <div class="lock-card">
    <div class="lock-logo">◈</div>
    <h2>Profit</h2>
    <p>Voer je wachtwoord in om verder te gaan</p>
    <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="off"
      onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">Inloggen</button>
    <div class="lock-err" id="lockErr"></div>
  </div>
</div>
<div id="app" style="display:none;">
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="storeTitle">Alle stores</h1>
      <div class="date" id="dateLbl">Vandaag · 20 jul</div>
    </div>
    <div class="refresh" onclick="refreshView()">↻</div>
  </div>

  <div class="periods" id="periods"></div>
  <div class="daterange" id="daterange" style="display:none;">
    <div class="df">
      <label>Van</label>
      <input type="date" id="dFrom" onchange="onDate()">
    </div>
    <span class="dsep">→</span>
    <div class="df">
      <label>Tot</label>
      <input type="date" id="dTo" onchange="onDate()">
    </div>
  </div>
  <div class="stores" id="storeTabs"></div>

  <div id="content"></div>

  <div id="inkoop" style="display:none;">
    <div class="scrape-box">
      <div class="lbl">Productlink van leverancier</div>
      <div class="scrape-form">
        <input type="url" id="urlInput" placeholder="https://www.temu.com/… of https://detail.1688.com/…"
          autocomplete="off" onkeydown="if(event.key==='Enter')scrapeProduct()">
        <button class="btn" id="scrapeBtn" onclick="scrapeProduct()">Ophalen</button>
      </div>
      <div class="scrape-msg" id="scrapeMsg"></div>
      <div class="scrape-sites"><span>Temu</span><span>1688</span><span>AliExpress</span><span>Alibaba</span><span>andere webshops</span></div>
    </div>
    <div id="scrapeResult"></div>
    <div class="list-head">
      <div class="section-lbl">Opgeslagen producten</div>
      <button class="btn ghost" id="refreshAllBtn" onclick="refreshAll()" style="display:none;">↻ Prijzen vernieuwen</button>
    </div>
    <div id="prodList"></div>
  </div>
</div>

<div class="nav">
  <a class="on" data-view="overzicht" onclick="showView('overzicht')"><span class="g">▦</span>Overzicht</a>
  <a data-view="inkoop" onclick="showView('inkoop')"><span class="g">◆</span>Inkoop</a>
  <a><span class="g">◫</span>Orders</a>
  <a><span class="g">◈</span>Ads</a>
  <a><span class="g">⚙</span>Settings</a>
</div>
</div>

<script>
// ---- Inlog ----
const PW='maico0804!';
let unlocked=false;
function tryLogin(){
  const v=document.getElementById('pw').value;
  if(v===PW){
    unlocked=true;
    document.getElementById('lockscreen').style.display='none';
    document.getElementById('app').style.display='block';
    render();                     // dashboard nu opbouwen
    setTimeout(init3D,80);        // 3D starten
    fetchStats();                 // echte cijfers ophalen
  }else{
    document.getElementById('lockErr').textContent='Onjuist wachtwoord';
    document.getElementById('pw').value='';
  }
}

// ---- VOORBEELDDATA (wordt later vervangen door echte Shopify/ad-data) ----
const stores = [
  {id:'all', name:'Alle stores', color:'#00e5c7'},
  {id:'fr',  name:'FR store 🇫🇷',  color:'#00ff88'},
  {id:'uk',  name:'UK store 🇬🇧',  color:'#ff9500'},
];
const periods = ['Vandaag','Gisteren','Deze week','Deze maand','30 dagen','Custom'];

// factor per periode om data te schalen (demo)
const pFactor = {'Vandaag':1,'Gisteren':.92,'Deze week':6.4,'Deze maand':27,'30 dagen':30,'Custom':1};

// custom datumbereik
let customFrom=null, customTo=null;

// basiscijfers per store (voor "Vandaag")
const base = {
  all:{rev:5780, spend:1470, cogs:1676, orders:98,  aov:59.0, roas:3.93, chg:9.4,  refundRate:0.047},
  fr: {rev:3180, spend:760,  cogs:922,  orders:54,  aov:58.9, roas:4.18, chg:11.2, refundRate:0.041},
  uk: {rev:2600, spend:710,  cogs:754,  orders:44,  aov:59.1, roas:3.66, chg:6.8,  refundRate:0.055},
};

let curStore='all', curPeriod='Vandaag';

// valuta-symbool op basis van gekozen store (UK = £, rest = €)
function curSym(){ return curStore==='uk' ? '£' : '€'; }
const eur = n => curSym()+n.toLocaleString('nl-NL',{maximumFractionDigits:0});
const eur2= n => curSym()+n.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});

// ---- Live data (van de server) met voorbeelddata als terugval ----
let liveData = null;      // {fr,uk,all} zodra opgehaald
let liveKey = '';         // welke periode is geladen

async function fetchStats(){
  const per=curPeriod;
  let url='/api/stats?period='+encodeURIComponent(per);
  if(per==='Custom' && customFrom && customTo){
    url+='&from='+customFrom+'&to='+customTo;
  }
  try{
    const r=await fetch(url);
    if(!r.ok) throw new Error('server '+r.status);
    const j=await r.json();
    if(j && j.all){ liveData=j; liveKey=per; render(); }
  }catch(e){
    // geen server / nog niet gekoppeld -> voorbeelddata blijft staan
    console.log('live data nog niet beschikbaar:',e.message);
  }
}

function calc(sid,per){
  // echte data indien beschikbaar voor deze periode
  if(liveData && liveKey===per && liveData[sid]){
    const m=liveData[sid];
    return {rev:m.rev,spend:m.spend,cogs:m.cogs,orders:m.orders,
            profit:m.profit,roas:m.roas,aov:m.aov,margin:m.margin,
            refunds:m.refunds,netRev:m.netRev,chg:base[sid]?base[sid].chg:0};
  }
  // anders: voorbeelddata
  const b=base[sid];
  let f=pFactor[per];
  if(per==='Custom' && customFrom && customTo){
    const days=Math.max(1,Math.round((new Date(customTo)-new Date(customFrom))/864e5)+1);
    f=days;
  }
  const rev=Math.round(b.rev*f), spend=Math.round(b.spend*f);
  const refunds=Math.round(rev*(b.refundRate||0.04));   // refunds per store
  const cogs=Math.round(rev*0.29);                        // COGS = 29% van omzet
  const orders=Math.round(b.orders*f);
  const netRev=rev-refunds;                               // omzet na refunds
  const profit=netRev-spend-cogs;                         // winst incl. refunds eraf
  const roas=+(rev/spend).toFixed(2);
  const aov=+(rev/orders).toFixed(1);
  const margin=+((profit/netRev)*100).toFixed(1);         // % over omzet na refunds
  return {rev,spend,cogs,orders,profit,roas,aov,margin,refunds,netRev,chg:b.chg};
}

function buildTabs(){
  document.getElementById('periods').innerHTML = periods.map(p=>
    `<div class="pill ${p===curPeriod?'active':''}" onclick="setPeriod('${p}')">${p}</div>`).join('');
  document.getElementById('storeTabs').innerHTML = stores.map(s=>
    `<div class="store ${s.id===curStore?'active':''}" onclick="setStore('${s.id}')">
       <span class="dot" style="background:${s.color}"></span>${s.name}</div>`).join('');
}
function setPeriod(p){curPeriod=p;render();fetchStats();}
function setStore(s){curStore=s;render();}
function onDate(){
  customFrom=document.getElementById('dFrom').value;
  customTo=document.getElementById('dTo').value;
  if(customFrom && customTo && customFrom>customTo){ // omdraaien indien nodig
    [customFrom,customTo]=[customTo,customFrom];
    document.getElementById('dFrom').value=customFrom;
    document.getElementById('dTo').value=customTo;
  }
  render();
  fetchStats();
}

function render(anim){
  if(curView!=='overzicht') return;   // Inkoop-view heeft eigen render
  buildTabs();
  // datumkiezer alleen bij Custom
  const dr=document.getElementById('daterange');
  dr.style.display = curPeriod==='Custom' ? 'flex' : 'none';
  if(curPeriod==='Custom' && !customFrom){
    // standaard: laatste 7 dagen
    const to=new Date(); const from=new Date(Date.now()-6*864e5);
    customTo=to.toISOString().slice(0,10);
    customFrom=from.toISOString().slice(0,10);
    document.getElementById('dFrom').value=customFrom;
    document.getElementById('dTo').value=customTo;
  }
  const d=calc(curStore,curPeriod);
  const st=stores.find(s=>s.id===curStore);
  document.getElementById('storeTitle').textContent=st.name;
  const isLive = liveData && liveKey===curPeriod;
  let lbl = curPeriod + (isLive ? '' : ' · demo-data');
  if(curPeriod==='Custom' && customFrom && customTo){
    const fmt=s=>{const [y,m,dd]=s.split('-');return dd+'/'+m;};
    lbl='Custom · '+fmt(customFrom)+' – '+fmt(customTo);
  }
  document.getElementById('dateLbl').textContent=lbl;

  const up=d.chg>=0;
  // ROAS kleur: >=2 groen, 1.7-1.99 oranje, daaronder rood
  const roasVal = d.roas>=2 ? 'var(--green)' : (d.roas>=1.7 ? 'var(--amber)' : 'var(--red)');
  const roasFoot= d.roas>=2 ? 'gezond' : (d.roas>=1.7 ? 'let op' : 'te laag');
  update3D(d.margin);
  const c=document.getElementById('content');
  c.className = anim?'fade':'';
  c.innerHTML=`
    <div class="hero">
      <div class="hero-left">
        <div class="lbl">Omzet ${curPeriod.toLowerCase()}</div>
        <div class="val">${eur(d.rev)}</div>
        <div class="sub">
          <span class="chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(d.chg)}%</span>
          <span class="margin">${d.margin}% winst</span>
        </div>
      </div>
      <div class="hero-marge">
        <canvas id="gl3d"></canvas>
        <div class="marge-num"><b style="color:${marginColor(d.margin)}">${eur(d.profit)}</b><em>profit</em></div>
      </div>
    </div>

    <div class="grid">
      ${kpiColor('Winst',eur(d.profit),'var(--green)','')}
      ${kpiColor('ROAS',d.roas.toFixed(2)+'x',roasVal,roasFoot)}
      ${kpiColor('Ad spend',eur(d.spend),'var(--amber)',(d.spend/d.rev*100).toFixed(0)+'% van omzet')}
      ${kpi('Est. COGS',eur(d.cogs),'','neu-t','29% van omzet')}
      ${kpiColor('Refunds',eur(d.refunds),'var(--pink)',(d.refunds/d.rev*100).toFixed(1)+'% van omzet')}
      ${kpi('Orders',d.orders,'','up-t','')}
      ${kpi('AOV',eur2(d.aov),'','neu-t','gem. orderwaarde')}
    </div>

    <div class="section-lbl">Winstopbouw</div>
    ${row('Omzet','+ '+eur(d.rev),'var(--green)')}
    ${row('Refunds','− '+eur(d.refunds),'var(--red)')}
    ${row('Ad spend','− '+eur(d.spend),'var(--red)')}
    ${row('Est. COGS','− '+eur(d.cogs),'var(--red)')}
    ${row('Nettowinst','= '+eur(d.profit),'var(--accent)')}
  `;
  requestAnimationFrame(init3D);
}
function kpi(l,v,u,cls,foot){
  return `<div class="card">
    <div class="lbl">${l}</div>
    <div class="val">${v}<span class="u">${u}</span></div>
    ${foot?`<div class="foot ${cls}">${foot}</div>`:''}
  </div>`;
}
function kpiColor(l,v,color,foot){
  return `<div class="card">
    <div class="lbl">${l}</div>
    <div class="val" style="color:${color}">${v}</div>
    ${foot?`<div class="foot">${foot}</div>`:''}
  </div>`;
}
function row(name,amt,col){
  return `<div class="row"><span class="name">${name}</span>
    <span class="amt" style="color:${col}">${amt}</span></div>`;
}

// ---- 3D marge-visual (Three.js) ----
let three=null, spin={x:0,y:0}, curMargin=30;
function init3D(){
  const canvas=document.getElementById('gl3d');
  if(!canvas) return;
  if(three && three.rnd.domElement===canvas) return; // al gekoppeld
  if(three){ three.rnd.dispose(); }                    // canvas vervangen -> opnieuw

  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(40,1,0.1,100);
  cam.position.set(0,0,4.8);
  let rnd;
  try{
    rnd=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  }catch(e){
    canvas.style.display='none';
    return;
  }
  rnd.setSize(150,150,false);
  rnd.setPixelRatio(Math.min(window.devicePixelRatio,2));

  // ---- particle-bol: veel kleine bolletjes op een fluctuerend boloppervlak ----
  const COUNT=900;
  const base=new Float32Array(COUNT*3);   // richtingsvectoren (genormaliseerd)
  const seed=new Float32Array(COUNT);
  const posArr=new Float32Array(COUNT*3);
  for(let i=0;i<COUNT;i++){
    // gelijkmatig over bol (fibonacci-spiraal)
    const phi=Math.acos(1-2*(i+0.5)/COUNT);
    const theta=Math.PI*(1+Math.sqrt(5))*i;
    const x=Math.sin(phi)*Math.cos(theta);
    const y=Math.sin(phi)*Math.sin(theta);
    const z=Math.cos(phi);
    base[i*3]=x; base[i*3+1]=y; base[i*3+2]=z;
    seed[i]=Math.random()*Math.PI*2;
  }
  const pgeo=new THREE.BufferGeometry();
  pgeo.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  const pmat=new THREE.PointsMaterial({
    color:0x00ff88, size:0.07, transparent:true, opacity:0.95,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const cloud=new THREE.Points(pgeo,pmat);
  cloud.rotation.set(spin.x,spin.y,0);
  scene.add(cloud);

  const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(3,4,5); scene.add(key);
  const rim=new THREE.DirectionalLight(0x5cffb0,1.6); rim.position.set(-4,-2,-3); scene.add(rim);
  scene.add(new THREE.AmbientLight(0x223044,0.9));
  const point=new THREE.PointLight(0x00e5c7,1.4,20); point.position.set(0,0,4); scene.add(point);

  three={scene,cam,rnd,cloud,pmat,base,seed,posArr,pgeo,COUNT};
  applyRoas();

  if(!init3D._looping){
    init3D._looping=true;
    let t=0;
    (function loop(){
      requestAnimationFrame(loop);
      if(!three) return;
      t+=0.016;
      const {base,seed,posArr,pgeo,COUNT,cloud}=three;
      for(let i=0;i<COUNT;i++){
        const bx=base[i*3],by=base[i*3+1],bz=base[i*3+2];
        const r=1
          +0.16*Math.sin(t*1.6+seed[i])
          +0.10*Math.sin(t*0.9+bx*3.0+by*2.0)
          +0.07*Math.sin(t*2.3+bz*4.0);
        posArr[i*3]=bx*r; posArr[i*3+1]=by*r; posArr[i*3+2]=bz*r;
      }
      pgeo.attributes.position.needsUpdate=true;
      spin.x+=0.0015; spin.y+=0.004;
      cloud.rotation.x=spin.x; cloud.rotation.y=spin.y;
      three.rnd.render(three.scene,three.cam);
    })();
  }
}
function applyRoas(){
  if(!three || !three.pmat) return;
  three.pmat.color.setHex(marginHex(curMargin));
}
function update3D(margin){ curMargin=margin; applyRoas(); }

// kleur op basis van profit-marge: >20 groen, 10-20 oranje, <10 roze/rood
function marginColor(m){
  return m>20 ? 'var(--green)' : (m>=10 ? 'var(--amber)' : 'var(--pink)');
}
function marginHex(m){
  return m>20 ? 0x00ff88 : (m>=10 ? 0xff9500 : 0xff2d78);
}

// ---- Views: Overzicht / Inkoop ----
let curView='overzicht';
function showView(v){
  curView=v;
  const ov = v==='overzicht';
  ['periods','storeTabs','content'].forEach(id=>{document.getElementById(id).style.display = ov?'':'none';});
  if(!ov) document.getElementById('daterange').style.display='none';
  document.getElementById('inkoop').style.display = v==='inkoop'?'block':'none';
  document.querySelectorAll('.nav a[data-view]').forEach(a=>a.classList.toggle('on',a.dataset.view===v));
  if(ov){ render(); }
  else{
    document.getElementById('storeTitle').textContent='Inkoop';
    document.getElementById('dateLbl').textContent='Inkoopprijzen · Temu, 1688, AliExpress …';
    renderInkoop();
  }
}
function refreshView(){ if(curView==='inkoop') refreshAll(); else render(true); }

// ---- Inkoop: productprijzen van leveranciers ophalen via /api/scrape ----
const PROD_KEY='inkoop_products';
let products=[];
try{ products=JSON.parse(localStorage.getItem(PROD_KEY)||'[]'); if(!Array.isArray(products)) products=[]; }catch(e){ products=[]; }
let scrapeLast=null;   // laatst opgehaald, nog niet opgeslagen product

function saveProducts(){ try{ localStorage.setItem(PROD_KEY,JSON.stringify(products)); }catch(e){} }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u==='string' && /^https?:\/\//i.test(u)) ? u : '';
const fmt2 = n => (+n).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const eurFix = n => '€'+fmt2(n);
function origPrice(p){
  if(p.price==null) return '';
  const sym={EUR:'€',USD:'$',GBP:'£',CNY:'¥',HKD:'HK$',JPY:'¥',AUD:'A$',CAD:'C$'}[p.currency]||(p.currency?p.currency+' ':'');
  return sym+fmt2(p.price)+(p.priceMax?' – '+sym+fmt2(p.priceMax):'');
}
function setMsg(t,ok){ const m=document.getElementById('scrapeMsg'); m.textContent=t||''; m.className='scrape-msg'+(ok?' ok':''); }

async function scrapeFetch(url){
  const r=await fetch('/api/scrape?url='+encodeURIComponent(url));
  const j=await r.json().catch(()=>null);
  if(!j) throw new Error('server '+r.status);
  return j;
}
async function scrapeProduct(){
  const inp=document.getElementById('urlInput');
  const url=inp.value.trim();
  if(!url){ setMsg('Plak eerst een productlink'); inp.focus(); return; }
  const btn=document.getElementById('scrapeBtn');
  btn.disabled=true; btn.textContent='Bezig…'; setMsg('');
  document.getElementById('scrapeResult').innerHTML='';
  scrapeLast=null;
  try{
    const j=await scrapeFetch(url);
    if(j.ok){
      scrapeLast=j;
      document.getElementById('scrapeResult').innerHTML=prodCard(j,-1);
      setMsg('Gevonden op '+(j.siteName||'website'),true);
    }else{
      setMsg(j.error||'Ophalen mislukt');
    }
  }catch(e){ setMsg('Server niet bereikbaar: '+e.message); }
  btn.disabled=false; btn.textContent='Ophalen';
}
function saveProduct(){
  if(!scrapeLast) return;
  const j=scrapeLast;
  const p={url:j.url,site:j.site,siteName:j.siteName,title:j.title,image:j.image,price:j.price,
           priceMax:j.priceMax,currency:j.currency,priceEur:j.priceEur,fetchedAt:j.fetchedAt,sell:null};
  const i=products.findIndex(x=>x.url===p.url);
  if(i>=0) products[i]={...products[i],...p,sell:products[i].sell};   // bestaand: prijs bijwerken
  else products.unshift(p);
  saveProducts();
  scrapeLast=null;
  document.getElementById('scrapeResult').innerHTML='';
  document.getElementById('urlInput').value='';
  setMsg('Opgeslagen',true);
  renderInkoop();
}
function removeProduct(i){ products.splice(i,1); saveProducts(); renderInkoop(); }
function setSell(i,v){
  const n=parseFloat(String(v).replace(',','.'));
  products[i].sell = n>0 ? n : null;
  saveProducts(); renderInkoop();
}
// brutomarge per product: verkoopprijs vs. inkoopprijs (in euro)
function margeInfo(p){
  if(!(p.sell>0) || p.priceEur==null) return null;
  const cogs=p.priceEur/p.sell*100;
  return {cogs, marge:100-cogs};
}
function prodCard(p,i){
  const img=safeUrl(p.image), url=safeUrl(p.url);
  const d=p.fetchedAt?new Date(p.fetchedAt):null;
  const when=d&&!isNaN(d)?d.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}):'';
  const eurTxt=p.priceEur!=null?eurFix(p.priceEur):(p.price!=null?origPrice(p):'?');
  const showOrig=p.priceEur!=null && p.currency!=='EUR';
  let calc='';
  if(i>=0){
    const m=margeInfo(p);
    const mtxt=m?`${m.marge.toFixed(0)}% brutomarge · COGS ${m.cogs.toFixed(0)}%`:'vul verkoopprijs in';
    const col=m?marginColor(m.marge):'var(--dim)';
    calc=`<div class="prod-calc"><label>Verkoop €</label>
      <input type="number" inputmode="decimal" step="0.01" min="0" value="${p.sell!=null?p.sell:''}" onchange="setSell(${i},this.value)">
      <span class="prod-marge" style="color:${col}">${mtxt}</span></div>`;
  }
  return `<div class="prod">
    ${img?`<img class="prod-img" src="${esc(img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<div class="prod-img"></div>'}
    <div class="prod-body">
      <div class="prod-meta">${esc(p.siteName||'website')}${when?' · '+esc(when):''}</div>
      ${url?`<a class="prod-title" href="${esc(url)}" target="_blank" rel="noopener">${esc(p.title||url)}</a>`:`<div class="prod-title">${esc(p.title||'')}</div>`}
      <div class="prod-price">Inkoop<b>${eurTxt}</b>${showOrig?`<span class="prod-orig">${esc(origPrice(p))}</span>`:''}</div>
      ${calc}
      ${i<0?`<div class="prod-actions"><button class="btn" onclick="saveProduct()">Opslaan in lijst</button></div>`:''}
    </div>
    ${i>=0?`<button class="x" onclick="removeProduct(${i})" aria-label="Verwijderen">✕</button>`:''}
  </div>`;
}
function renderInkoop(){
  const list=document.getElementById('prodList');
  const btn=document.getElementById('refreshAllBtn');
  if(!products.length){
    list.innerHTML='<div class="empty">Nog geen producten.<br>Plak hierboven een link van Temu, 1688, AliExpress of een andere webshop.</div>';
    btn.style.display='none';
    return;
  }
  btn.style.display='';
  const withSell=products.map(margeInfo).filter(Boolean);
  let summary='';
  if(withSell.length){
    const avgCogs=withSell.reduce((a,m)=>a+m.cogs,0)/withSell.length;
    const totalIn=products.reduce((a,p)=>a+(p.priceEur||0),0);
    summary=`<div class="grid">
      ${kpiColor('Gem. COGS',avgCogs.toFixed(0)+'%',marginColor(100-avgCogs),'van verkoopprijs · dashboard rekent 29%')}
      ${kpi('Producten',products.length,'','neu-t','inkoop samen '+eurFix(totalIn))}
    </div>`;
  }
  list.innerHTML=summary+products.map((p,i)=>prodCard(p,i)).join('');
}
// alle opgeslagen producten opnieuw ophalen (prijzen bijwerken)
async function refreshAll(){
  if(!products.length || refreshAll._busy) return;
  refreshAll._busy=true;
  const btn=document.getElementById('refreshAllBtn'); btn.disabled=true;
  let ok=0, fail=0;
  for(let i=0;i<products.length;i++){
    setMsg(`Vernieuwen ${i+1}/${products.length}…`,true);
    try{
      const j=await scrapeFetch(products[i].url);
      if(j.ok){
        products[i]={...products[i],title:j.title||products[i].title,image:j.image||products[i].image,
          price:j.price,priceMax:j.priceMax,currency:j.currency,priceEur:j.priceEur,fetchedAt:j.fetchedAt};
        ok++;
      }else fail++;
    }catch(e){ fail++; }
  }
  saveProducts(); renderInkoop();
  setMsg(fail?`${ok} bijgewerkt, ${fail} mislukt`:`${ok} producten bijgewerkt`, !fail);
  btn.disabled=false; refreshAll._busy=false;
}

// dashboard wacht op inlog; focus op wachtwoordveld
window.addEventListener('load',()=>{document.getElementById('pw').focus();});

</script>
