[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fomo-bot"
version = "0.1.0"
description = "Smart-money + social momentum signal engine for memecoins — paper trading only"
requires-python = ">=3.11"
license = { text = "MIT" }

# The decision core deliberately has ONE runtime dependency. Scoring, risk, signals,
# paper trading and backtesting run on the standard library plus pydantic, which means
# they are trivially testable and cannot break because a data provider changed.
# Everything that touches the network lives behind an optional extra.
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
# Phase 1-3: ingestion, database, API. Install when you start collecting real data.
runtime = [
    "httpx[http2]>=0.27",
    "tenacity>=9.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "structlog>=24.4",
]
# Phase 5: LLM tweet classification.
ai = [
    "anthropic>=0.40",
]
# Phase 10: ML probability model.
ml = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
fomo = "fomo.cli:main"

[tool.setuptools.packages.find]
include = ["fomo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: hits real external APIs; requires keys, excluded from CI (docs/05 §3 laag 4)",
    "slow: long-running replay regression",
]

[tool.coverage.run]
source = ["fomo"]
omit = ["fomo/cli.py"]

[tool.coverage.report]
# The decision core is where correctness matters; adapters are covered by contract tests.
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # we use typographic dashes in explanation strings on purpose
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
# Only the pure core is type-strict; adapters deal with untyped provider payloads.
files = ["fomo/scoring", "fomo/risk", "fomo/signals", "fomo/trading", "fomo/config.py", "fomo/domain.py"]
